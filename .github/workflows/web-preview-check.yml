name: IZZAT web preview checks
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web-preview-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/editor.js
      - run: node --test web/tests/*.test.mjs
